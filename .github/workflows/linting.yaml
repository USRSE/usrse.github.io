name: Check Spelling and URLs

on: [pull_request]

# Kill concurrent jobs from the same PR/branch - only one will run at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  css-collision:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Check for Sass/CSS output collisions
      run: |
        status=0
        # Jekyll skips _-prefixed dirs/files (partials), so only non-underscore Sass files produce output
        for f in $(git ls-files '*.scss' '*.sass' | grep -Ev '(^|/)_'); do
          css="${f%.*}.css"
          if [ -e "$css" ]; then
            echo "::error file=$f::$f compiles to $css, which already exists as a static file. Jekyll will silently serve only one of them. See docs/details.md."
            status=1
          fi
        done
        exit $status

  urlcheck:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        # Full history so we can diff against the base branch
        fetch-depth: 0

    - name: Check Spelling
      uses: crate-ci/typos@master # we should really incorporate all new changes
      with:
        files: ./_posts ./_events ./pages ./README.md
        config: ./.github/workflows/typo_config.toml

    - name: Read URL checker config
      id: config
      uses: ./.github/actions/urlchecker-config

    # Only check URLs in files this PR adds or modifies, so links that break
    # elsewhere on the site don't fail unrelated PRs (url-health.yaml reports
    # those). Job data files are split out: only the URLs a PR adds to them are
    # checked (see below).
    - name: Find changed files
      id: changed
      env:
        JOB_FILES: ${{ steps.config.outputs.job_files }}
      run: |
        echo "$JOB_FILES" | tr , '\n' > "$RUNNER_TEMP/job-files"
        changed=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" \
          | grep -E '\.(md|py|yml)$' || true)
        site=$(echo "$changed" | grep -Fvx -f "$RUNNER_TEMP/job-files" | grep -v '^$' | paste -sd, -)
        jobs=$(echo "$changed" | grep -Fx -f "$RUNNER_TEMP/job-files" | paste -sd' ' -)
        echo "Site files: ${site:-none}"
        echo "Job files: ${jobs:-none}"
        echo "site=$site" >> "$GITHUB_OUTPUT"
        echo "jobs=$jobs" >> "$GITHUB_OUTPUT"

    - name: URLs-checker
      # An empty include_files would check the whole repo, so skip instead
      if: steps.changed.outputs.site != ''
      uses: urlstechie/urlchecker-action@0.0.34
      with:
        # Only check files changed in this PR
        include_files: ${{ steps.changed.outputs.site }}

        # A comma-separated list of file types to cover in the URL checks
        file_types: .md,.py,.yml

        # Choose whether to include file with no URLs in the prints.
        print_all: false

        # More verbose summary at the end of a run
        verbose: true

        # How many times to retry a failed request (defaults to 1)
        retry_count: 3

        # Google Forms is having enormous timeouts
        timeout: 10

        # Shared lists, edit them in .github/urlchecker/
        exclude_patterns: ${{ steps.config.outputs.exclude_patterns }}
        exclude_files: ${{ steps.config.outputs.exclude_files }}

    # Existing job links go stale as postings close; the nightly
    # clean-expired-jobs workflow handles those. Here we only check new URLs.
    - name: Set up Python
      if: steps.changed.outputs.jobs != ''
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: Check URLs added to job data files
      if: steps.changed.outputs.jobs != ''
      run: |
        pip install urlchecker==0.0.34
        python scripts/check_added_urls.py "origin/${{ github.base_ref }}" ${{ steps.changed.outputs.jobs }}
