[files]
extend-exclude = [
    ".git/",
    ".github/workflows/typo_config.toml",
    "assets/js/*.min.*",
    "pages/feeds/*.xml",
    "_posts/2024-11-08-sc-candidates.md"
]
ignore-hidden = true
[default]
extend-ignore-re = [
    "Brain tailoRed stImulation protocoL",
    "Vas Vasiliadis",
    "Nam Pho",
    "SLAC",
    "Paul Hsi",
    "NWO",
    "ND",
    "AAS",
    "Villegas",
    "Wil",
    "Lok",
    "BITCON",
    "annote",
    "Annote",
    # Embedded <script> libraries
    '(?is)<script.*?</script>',
    # Embedded <style> blocks
    '(?is)<style.*?</style>',
    # Pandoc/Quarto syntax-highlight token classes, e.g. class="ot", class="fu"
    'class="[a-z]{2}"'
]
