- expires: '2026-10-29'
  type: event
  title: 'The HPC Best Practices webinar October 2026: Building the Future of High-Performance
    Software, Together...'
  when: '2026-10-28'
  where: Online
  preamble: |-
    *The HPSF: Building the Future of High-Performance Software, Together*
    will be presented by *Julien Bigot (CEA), Xavier Delaruelle (CEA), and Axel Huebl (Lawrence Berkeley National Laboratory)*
    on *October 28 1:00pm - 2:00pm EDT*

    *Registration:* zoomgov.com/meeting/register/…

    The High Performance Software Foundation (HPSF), a project within the Linux Foundation, champions, promotes, and advances core portable software for HPC. It achieves this by increasing adoption, lowering barriers to contribution, and supporting open-source HPC projects. Announced at SC23 and officially launched in May 2024, the foundation has rapidly grown into a global endeavor with a robust membership. Today, many critical software projects across the HPC stack, ranging in size and scope, have joined the HPSF.
    This presentation will introduce the foundation and its operational model. We will detail the support the HPSF offers to hosted projects, including tools and cross-cutting initiatives for event organization, CI/CD, continuous benchmarking, outreach, training, packaging, and distribution.
    Following this general overview, the presentation will focus on two projects of varying scales that joined the foundation with distinct needs: Environment Modules and WarpX. We will explore how their integration into the foundation was managed and the concrete benefits each project has realized.
  links: '[View details](https://ideas-productivity.org/events/hpcbp-101-hpsf)'
