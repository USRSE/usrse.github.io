- expires: '2026-09-30'
  type: event
  title: 'Call for Experts for Standing Committee on Use of AI in Science: Integrity,
    Trust, and Innovation'
  when: '2026-09-30'
  where: Online
  preamble: |-
    The National Academies of Sciences, Engineering, and Medicine will convene the _Standing Committee on Use of AI in Science: Integrity, Trust, and Innovation in the Scientific Enterprise_ to explore how artificial intelligence (AI) is challenging the norms, standards, and governance mechanisms used to ensure research trustworthiness, reproducibility, and alignment with societal values.
    The standing committee will host a series of public sessions organized around key topics, including research integrity and reproducibility; transparency and trustworthiness; authorship and accountability; and peer review.
    The National Academies is seeking suggestions for experts with relevant knowledge and experience to inform the composition and work of the standing committee.
    _*The National Academies value a wide range of perspectives to strengthen the quality of our work. We carefully consider alternative viewpoints when formulating advice, convening experts with differing experience and perspectives, providing oversight, and conducting all other activities, and strive to foster an environment where all can participate fully. We welcome your suggestions for a broad range of experts to work with us.*_
  links: '[View details](https://survey.alchemer.com/s3/8988038/Call-for-Experts-for-Standing-Committee-on-Use-of-AI-in-Science-Integrity-Trust-and-Innovation)'
