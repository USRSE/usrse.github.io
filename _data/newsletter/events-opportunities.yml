- expires: '2026-10-01'
  type: opportunity
  title: First Annual IEEE Workshop on Curation and Contextualization of Extreme Datasets
    (ExtremeDataCuration 2026)
  when: '2026-10-01'
  where: In-person
  preamble: |-
    The First Annual IEEE Workshop on Curation and Contextualization of Extreme Datasets (ExtremeDataCuration 2026), co-located with IEEE BigData, is soliciting papers from researchers and practitioners across data curation, data management, scientific computing, information science, AI/ML, and related disciplines. Interdisciplinary contributions and papers that identify unresolved technical, organizational, or governance challenges are especially encouraged.

    We are looking for 8-page papers about any of the following topics:
    - Practical experiences with success and failure of extreme scale dataset management
    - Foundations of data curation: theory, life cycle models, conceptual frameworks, and evaluation models
    - Provenance capture, representation, querying, validation, and management at scale
    - Data life cycle curation of heterogeneous datasets to preserve privacy and community access requirements
    - Actionable FAIR properties in computational science workflows: beyond FAIRness checklists, including limits, tradeoffs, and complementary curation mechanisms
    - Data quality assessment, observability, validation, repair, and remediation for large-scale heterogeneous datasets
    - Curation for AI/ML readiness including privacy, dataset versioning, and data life cycle management
    - Automated and AI-assisted curation, including human-in-the-loop approaches
    - Life cycle management and data curation in HPC, cloud, and distributed computing environments
    - Curation tooling, infrastructure, middleware, and workflow-integrated services
    - Case studies and lessons learned from scientific and enterprise deployments
    - Benchmarks, metrics, and evidence for curation effectiveness and reuse outcomes

    Submissions are due Oct 1st.
  links: '[View details](https://extremedatacurationworkshop.github.io/)'
