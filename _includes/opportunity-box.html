<div class="alert alert-success" role="alert" style="margin-bottom: 30px;">
  <h4 class="alert-heading">🚀 {{ include.title }}</h4>
  <div class="newsletter-event-preamble">{{ include.preamble | markdownify }}</div>
  <div class="newsletter-event-links">{{ include.links | markdownify | replace: '<a ', '<a target="_blank" rel="noopener" ' }}</div>
</div>
